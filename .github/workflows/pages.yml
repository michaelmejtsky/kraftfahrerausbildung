name: Kraftfahrerausbildung prüfen und veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kraftfahrer-pages
  cancel-in-progress: false
jobs:
  checks:
    name: Code und Rechte prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ausbildungslogik, Rechte und Oberfläche prüfen
        run: |
          node tests/domain.cjs
          node tests/setup-migration.cjs
          node tests/access-evidence.cjs
          node tests/push.cjs
          node tests/push-service-worker.cjs
          node tests/push-ui.cjs
          node tests/frontend.cjs
          node tests/startup.cjs
          node tests/training-ui.cjs
          node tests/hlf2-import.cjs
          node tests/hlf2-ui.cjs
          node tests/learning-domain.cjs
          node tests/learning-ui.cjs
          node tests/staff-invite-ui.cjs
          node tests/worker.mjs
          node --check dist/startup.js
          node --check dist/app.js
          node --check dist/access-evidence.js
          node --check dist/push-ui.js
          node --check dist/training-extensions.js
          node --check dist/learning-ui.js
          node -e "new Function(require('fs').readFileSync('backend/Code.gs','utf8'))"
      - name: Lokales Installationspaket prüfen
        run: python3 pack.py
      - name: Bisherige App-Adressen erhalten
        run: |
          python3 tests/pages-package.py
          python3 prepare-pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
  deploy:
    name: App über GitHub Pages veröffentlichen
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages-Konfiguration prüfen
        uses: actions/configure-pages@v5
      - name: App veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
